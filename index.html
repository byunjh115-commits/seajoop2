  function reward(){app.innerHTML=`<section class="screen on">${header('🎉 인증 보상')}<div class="card reward"><div class="coin">🪙</div><h2>+50P · 🎟 +1</h2><p class="notice">사진 한 장당 보상은 한 번만 받을 수 있어요.</p><button class="primary" data-page="draw">해양 생물 뽑기 하러 가기</button><button class="secondary" data-page="verify">다른 사진 인증하기</button></div>${nav()}</section>`}
  function tank(){let list=state.unlocked.map(i=>`<button data-place="${i}" class="${state.placed.includes(i)?'in':''}"><i style="background-image:url('${image(i)}')"></i><small>${animals[i][0]}</small></button>`).join('')||'<div class="empty">🔒 뽑기로 해금한 생물만 수족관에 넣을 수 있어요.</div>';app.innerHTML=`<section class="screen on">${header('🐠 나의 수족관')}<div class="stats"><div class="stat">포인트<b>${state.points}P</b></div><div class="stat">뽑기권<b>${state.tickets}</b></div></div><div class="aquarium" id="aqua"></div><p class="notice">아래 해금 생물을 눌러 넣고 빼세요. 생물은 드래그로 옮길 수 있어요.</p><div class="picker">${list}</div><button class="primary" data-page="draw">🎁 뽑기 창 열기</button>${nav()}</section>`; const box=document.querySelector('#aqua');state.placed.forEach((id,n)=>{let el=document.createElement('i');el.className='tank-life';el.style.backgroundImage=`url('${image(id)}')`;el.style.left=`${8+(n*17)%75}%`;el.style.top=`${12+(n*23)%65}%`;el.style.animation=`swim${id%4} ${4+(id%3)}s ease-in-out infinite alternate`;makeDrag(el);box.append(el)})}

  function shop(){let tourist=[['🌉','광안대교 핀배지',550],['🐬','돌고래 핀배지',650],['🕊️','갈매기 핀배지',600],['🐢','바다거북 핀배지',700],['🔑','광안대교 키링',1100],['🧲','부산 마그넷',900],['💌','해운대 엽서 세트',1200],['👜','부산 한정 에코백',1800]],resident=[['🎟️','부산 지역 상품권',4000],['☕','카페 쿠폰',2500],['🏪','편의점 쿠폰',3000],['🎬','영화 관람권',6000],['🍽️','지역 식사 쿠폰',5000]];let goods=state.mode==='tourist'?tourist:resident;app.innerHTML=`<section class="screen on">${header('🛍️ 포인트 상점')}<div class="hero"><h2>${state.mode==='tourist'?'관광객 부산 기념품':'거주민 리워드'}</h2><p>보유 포인트: ${state.points}P</p></div><div class="shop-grid">${goods.map((g,i)=>`<article class="good"><span>${g[0]}</span><b>${g[1]}</b><small>${g[2]}P</small><button data-buy="${i}" ${state.points<g[2]?'disabled':''}>구매하기</button></article>`).join('')}</div>${state.mode==='resident'?'<button class="secondary" data-page="rank">🏆 월간 랭킹 보기</button>':''}${nav()}</section>`; app.dataset.goods=JSON.stringify(goods)}

<script>
  // 기념품 구매 후 표시되는 시연용 바코드 교환권입니다.
  (() => {
    const makeBarcode = code => {
      let seed = 0;
      for (const char of code) seed = (seed * 31 + char.charCodeAt(0)) >>> 0;
      let bars = '';
      for (let x = 12; x < 308; x += 4) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        const width = 2 + (seed % 3) * 2;
        bars += `<rect x="${x}" y="10" width="${width}" height="82" fill="#101820"/>`;
      }
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="118" viewBox="0 0 320 118"><rect width="320" height="118" rx="12" fill="white"/>${bars}<text x="160" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#101820">${code}</text></svg>`)}`;
    };
    const originalAlert = window.alert.bind(window);
    window.alert = message => {
      if (!String(message).includes('바코드:')) return originalAlert(message);
      const [title, codeLine] = String(message).split(/\n|\\n/);
      const code = (codeLine || '바코드: SSEUJUP-DEMO').replace('바코드: ', '');
      const old = document.querySelector('#barcodeVoucher');
      if (old) old.remove();
      document.body.insertAdjacentHTML('beforeend', `<div id="barcodeVoucher" class="voucher-layer"><article class="voucher-card"><span class="voucher-icon">🎁</span><h2>${title}</h2><p>기념품 교환 바코드</p><img alt="${code} 바코드" src="${makeBarcode(code)}"><small>시연용 바코드입니다. 기념품샵에서 스캔하면 교환할 수 있어요.</small><button id="closeVoucher">확인</button></article></div>`);
    };
    document.addEventListener('click', event => {
      if (event.target.closest('#closeVoucher') || event.target.id === 'barcodeVoucher') {
        document.querySelector('#barcodeVoucher')?.remove();
      }
    });
    document.head.insertAdjacentHTML('beforeend', `<style>.voucher-layer{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:20px;background:#001f3288}.voucher-card{width:min(100%,360px);padding:26px 22px;border-radius:24px;text-align:center;background:linear-gradient(160deg,#fff,#e8fbfa);box-shadow:0 20px 45px #001b2e66}.voucher-icon{font-size:42px}.voucher-card h2{margin:10px 0 5px;color:#123b53}.voucher-card p{margin:0 0 16px;color:#147778;font-weight:700}.voucher-card img{display:block;width:100%;height:126px;object-fit:contain;padding:5px;background:#fff;border:1px solid #d6ecea;border-radius:14px}.voucher-card small{display:block;margin:14px 0;color:#68808a;line-height:1.45}.voucher-card button{width:100%;padding:14px;border-radius:13px;background:#087fc7;color:#fff;font-weight:800}</style>`);
  })();
</script>

    const applyLanguage = () => {
      const table = words[window.sseujupLanguage];
      if (!table) return;
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        let value = node.nodeValue;
        Object.entries(table).sort((a,b)=>b[0].length-a[0].length).forEach(([ko, translated]) => { value = value.split(ko).join(translated); });
        if (value !== node.nodeValue) node.nodeValue = value;
      });
    };
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-language]');
      if (!button) return;
      window.sseujupLanguage = button.dataset.language;
      document.documentElement.lang = window.sseujupLanguage === 'English' ? 'en' : window.sseujupLanguage === '中文' ? 'zh' : window.sseujupLanguage === '日本語' ? 'ja' : 'ko';
      setTimeout(applyLanguage, 0);
    }, true);
    new MutationObserver(applyLanguage).observe(document.body, {childList:true, subtree:true});
  })();

<script>
  // 언어를 여러 번 바꿔도 항상 원본 문구에서 다시 번역합니다.
  (() => {
    const savedLanguage = decodeURIComponent(location.hash.slice(1));
    if (savedLanguage) {
      const restore = () => document.querySelector(`[data-language="${savedLanguage}"]`)?.click();
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', restore, {once:true});
      else restore();
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-language]');
      if (!button || !event.isTrusted) return;
      location.hash = encodeURIComponent(button.dataset.language);
      location.reload();
    }, true);
    document.head.insertAdjacentHTML('beforeend', '<style>.lang button{padding:5px 7px;font-size:12px}</style>');
  })();
</script>
<script>
  // 카메라 촬영 사진을 기존 사진 인증 흐름으로 전달합니다.
  (() => {
    let stream = null;
    const stopCamera = () => {
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      document.querySelector('#cameraLayer')?.remove();
    };
    const addCameraButton = () => {
      const input = document.querySelector('#upload');
      if (!input || document.querySelector('#takeCamera')) return;
      input.closest('.upload')?.insertAdjacentHTML('beforeend', '<button type="button" id="takeCamera" class="camera-button">📷 카메라로 촬영하기</button><p class="notice">카메라 사용 허용 후 쓰레기 사진을 바로 촬영할 수 있어요.</p>');
    };
    new MutationObserver(addCameraButton).observe(document.body, {childList:true, subtree:true});
    document.addEventListener('click', async event => {
      if (event.target.closest('#takeCamera')) {
        try {
          if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
          stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
          document.body.insertAdjacentHTML('beforeend', '<div id="cameraLayer" class="camera-layer"><section class="camera-box"><h2>📷 쓰레기 사진 촬영</h2><video id="cameraVideo" autoplay playsinline></video><p>카메라에 쓰레기가 잘 보이도록 맞춰 주세요.</p><div><button id="capturePhoto" class="camera-capture">● 촬영하기</button><button id="closeCamera" class="camera-close">취소</button></div></section></div>');
          document.querySelector('#cameraVideo').srcObject = stream;
        } catch (error) {
          stopCamera();
          alert('카메라를 사용할 수 없습니다. 카메라 사용을 허용했는지 확인해 주세요.\nGitHub Pages처럼 HTTPS 환경에서 가장 안정적으로 동작합니다.');
        }
      }
      if (event.target.closest('#closeCamera')) stopCamera();
      if (event.target.closest('#capturePhoto')) {
        const video = document.querySelector('#cameraVideo');
        if (!video?.videoWidth) return;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        canvas.toBlob(blob => {
          const input = document.querySelector('#upload');
          if (blob && input) {
            const transfer = new DataTransfer();
            transfer.items.add(new File([blob], 'camera-trash.jpg', {type:'image/jpeg'}));
            input.files = transfer.files;
            input.dispatchEvent(new Event('change', {bubbles:true}));
          }
          stopCamera();
        }, 'image/jpeg', .92);
      }
    });
    document.head.insertAdjacentHTML('beforeend', '<style>.camera-button{display:block;width:100%;margin-top:12px;padding:13px;border-radius:13px;background:#0b8ccd;color:#fff;font-weight:800}.camera-layer{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:18px;background:#001d2dcc}.camera-box{width:min(100%,420px);padding:20px;border-radius:23px;background:#fff;text-align:center}.camera-box h2{margin:0 0 14px;color:#17394d}.camera-box video{width:100%;max-height:52vh;object-fit:cover;background:#132c3b;border-radius:15px}.camera-box p{font-size:13px;color:#587481}.camera-capture,.camera-close{padding:12px 15px;border-radius:12px;font-weight:800}.camera-capture{background:#087fc7;color:#fff}.camera-close{margin-left:8px;background:#e7efef;color:#42616d}</style>');
    addCameraButton();
  })();
</script>
